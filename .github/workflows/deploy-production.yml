# =======================================================
# Deploy to Production (Hetzner Cloud)
# =======================================================
# Triggers: on push to master/main, or manually via GitHub UI.
# Purpose: build backend (Spring Boot) and frontend (React/Vite),
#          deploy them to a Hetzner server, and restart services.
# =======================================================

name: Deploy to Production

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:   # allows manual trigger from GitHub Actions tab

# =======================================================
# Environment variables – single source of truth for paths.
# Using these avoids hard‑coding paths in multiple steps,
# making the workflow easier to maintain and change.
# =======================================================
env:
  APP_PATH: /opt/rental-app                # where the backend JAR lives
  WEB_PATH: /var/www/rental-admin          # where the frontend static files are served
  JAR_NAME: backend-0.0.1-SNAPSHOT.jar     # name of the built JAR
  BACKEND_PORT: 8585                       # port Spring Boot listens on

jobs:
  deploy:
    runs-on: ubuntu-latest                 # GitHub's hosted runner (Linux)

    steps:
      # ---------------------------------------------------
      # 1. Check out the source code
      # ---------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        # This pulls the latest code from your branch into the runner.

      # ---------------------------------------------------
      # 2. Set up Java 17 (required for Spring Boot 3)
      # ---------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'   # popular OpenJDK distribution
        # This ensures the correct JDK is available for Maven builds.

      # ---------------------------------------------------
      # 3. Cache Maven dependencies
      # ---------------------------------------------------
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
        # Caching the local Maven repository speeds up subsequent builds
        # because dependencies are downloaded only when pom.xml changes.

      # ---------------------------------------------------
      # 4. Build the backend (Spring Boot JAR)
      # ---------------------------------------------------
      - name: Build Backend
        run: |
          cd backend
          mvn clean package -DskipTests
        # 'clean' removes old artifacts, 'package' creates the JAR.
        # -DskipTests skips unit tests to speed up the build in CI.

      # ---------------------------------------------------
      # 5. Set up Node.js 18 (required for Vite/React)
      # ---------------------------------------------------
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web-admin/package-lock.json
        # Node 18 is required for Vite. Caching npm dependencies
        # reduces install time when package-lock.json hasn't changed.

      # ---------------------------------------------------
      # 6. Build the frontend (React + Vite)
      # ---------------------------------------------------
      - name: Build Web-Admin
        run: |
          cd web-admin
          npm install
          npm run build
        # npm install installs dependencies, npm run build creates the dist/ folder.

      # =======================================================
      # 7. Deploy to Hetzner server
      # =======================================================

      # ---------------------------------------------------
      # 7a. Set up SSH authentication
      # ---------------------------------------------------
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        # This action securely injects your private SSH key into the runner,
        # allowing us to connect to the Hetzner server without storing plaintext keys.

      # ---------------------------------------------------
      # 7b. Add server to known_hosts (avoid host key confirmation)
      # ---------------------------------------------------
      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
        # ssh-keyscan adds the server's fingerprint to known_hosts,
        # so that the SSH connection won't be blocked by an interactive prompt.

      # ---------------------------------------------------
      # 7c. Backup current JAR (for rollback safety)
      # ---------------------------------------------------
      - name: Backup current JAR (optional rollback)
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cp ${{ env.APP_PATH }}/${{ env.JAR_NAME }} ${{ env.APP_PATH }}/${{ env.JAR_NAME }}.backup || true"
        # We copy the existing JAR to a .backup file (if it exists).
        # The '|| true' ensures the step doesn't fail if the JAR doesn't exist yet.
        # This allows manual rollback if the new deployment introduces a critical issue.

      # ---------------------------------------------------
      # 7d. Copy the new backend JAR to the server
      # ---------------------------------------------------
      - name: Copy Backend JAR
        run: |
          scp backend/target/${{ env.JAR_NAME }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.APP_PATH }}/
        # 'scp' copies the newly built JAR to the server's application directory.

      # ---------------------------------------------------
      # 7e. Restart the backend systemd service
      # ---------------------------------------------------
      - name: Restart Backend Service
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "systemctl restart rental-app"
        # systemd manages the Spring Boot process. Restarting it loads the new JAR.

      # ---------------------------------------------------
      # 7f. Health check – wait until the backend is responsive
      # ---------------------------------------------------
      - name: Wait for Backend to be Healthy
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "for i in {1..30}; do \
               curl -s -o /dev/null -w '%{http_code}' http://localhost:${{ env.BACKEND_PORT }}/api/properties | grep 200 && echo 'Backend is ready' && break || \
               echo 'Waiting for backend...' && sleep 2; \
             done"
        # This loop attempts to GET the /api/properties endpoint up to 30 times (60 seconds).
        # It waits for a 200 (OK) response before proceeding.
        # If the backend isn't ready, the workflow will eventually fail, preventing Nginx
        # from proxying to a dead service (which would cause 502 errors).

      # ---------------------------------------------------
      # 7g. Sync frontend files using rsync (smart deployment)
      # ---------------------------------------------------
      - name: Sync Web-Admin static files (rsync)
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p ${{ env.WEB_PATH }}"
          rsync -avz --delete web-admin/dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.WEB_PATH }}/
        # rsync is more efficient than scp -r:
        # - It transfers only changed files (saving time).
        # - The --delete flag removes files on the server that no longer exist in dist/,
        #   keeping the folder clean and avoiding stale assets.
        # - -avz means archive mode, verbose, compress.

      # ---------------------------------------------------
      # 7h. Reload Nginx (gracefully apply configuration)
      # ---------------------------------------------------
      - name: Reload Nginx
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "nginx -t && systemctl reload nginx"
        # First, we test the Nginx configuration with 'nginx -t'.
        # If the syntax is correct, we 'reload' Nginx so it picks up any changes
        # (e.g., if the proxy_pass port was updated). Reload is graceful – existing
        # connections are not interrupted.