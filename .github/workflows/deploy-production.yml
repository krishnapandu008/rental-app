# =======================================================
# Deploy to Hetzner Cloud – Staging & Production
# =======================================================
# Triggers:
#   - push to dev   → deploys to staging environment
#   - push to main  → deploys to production environment
#   - manual trigger (workflow_dispatch)
# =======================================================

name: Deploy to Server

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

# =======================================================
# Environment variables – paths are set per branch later.
# =======================================================
env:
  JAR_NAME: backend-0.0.1-SNAPSHOT.jar
  BACKEND_PORT: 8585

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # 2. Set up JDK 17
      # ---------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ---------------------------------------------------
      # 3. Cache Maven dependencies
      # ---------------------------------------------------
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # ---------------------------------------------------
      # 4. Build Backend
      # ---------------------------------------------------
      - name: Build Backend
        run: |
          cd backend
          mvn clean package -DskipTests

      # ---------------------------------------------------
      # 5. Set up Node.js 18
      # ---------------------------------------------------
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web-admin/package-lock.json

      # ---------------------------------------------------
      # 6. Build Web-Admin
      # ---------------------------------------------------
      - name: Build Web-Admin
        run: |
          cd web-admin
          npm install
          npm run build

      # =======================================================
      # 7. Deploy – choose environment based on branch
      # =======================================================

      - name: Set deployment paths and service name
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "APP_PATH=/opt/rental-app-staging" >> $GITHUB_OUTPUT
            echo "WEB_PATH=/var/www/rental-admin-staging" >> $GITHUB_OUTPUT
            echo "SERVICE_NAME=rental-app-staging" >> $GITHUB_OUTPUT
          else
            echo "APP_PATH=/opt/rental-app" >> $GITHUB_OUTPUT
            echo "WEB_PATH=/var/www/rental-admin" >> $GITHUB_OUTPUT
            echo "SERVICE_NAME=rental-app" >> $GITHUB_OUTPUT
          fi

      # ---------------------------------------------------
      # 7a. SSH setup
      # ---------------------------------------------------
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # ---------------------------------------------------
      # 7b. Backup current JAR (if exists)
      # ---------------------------------------------------
      - name: Backup current JAR
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cp ${{ steps.env.outputs.APP_PATH }}/${{ env.JAR_NAME }} ${{ steps.env.outputs.APP_PATH }}/${{ env.JAR_NAME }}.backup || true"

      # ---------------------------------------------------
      # 7c. Copy new JAR
      # ---------------------------------------------------
      - name: Copy Backend JAR
        run: |
          scp backend/target/${{ env.JAR_NAME }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ steps.env.outputs.APP_PATH }}/

      # ---------------------------------------------------
      # 7d. Restart the specific systemd service
      # ---------------------------------------------------
      - name: Restart Backend Service
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "systemctl restart ${{ steps.env.outputs.SERVICE_NAME }}"

      # ---------------------------------------------------
      # 7e. Health check (wait for backend to respond)
      # ---------------------------------------------------
      - name: Wait for Backend to be Healthy
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "for i in {1..30}; do \
               curl -s -o /dev/null -w '%{http_code}' http://localhost:${{ env.BACKEND_PORT }}/api/properties | grep 200 && echo 'Backend is ready' && break || \
               echo 'Waiting for backend...' && sleep 2; \
             done"

      # ---------------------------------------------------
      # 7f. Sync frontend files using rsync
      # ---------------------------------------------------
      - name: Sync Web-Admin static files
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p ${{ steps.env.outputs.WEB_PATH }}"
          rsync -avz --delete web-admin/dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ steps.env.outputs.WEB_PATH }}/

      # ---------------------------------------------------
      # 7g. Reload Nginx (apply any config changes)
      # ---------------------------------------------------
      - name: Reload Nginx
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "nginx -t && systemctl reload nginx"