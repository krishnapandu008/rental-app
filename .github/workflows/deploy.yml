# =======================================================
# Deploy to Hetzner Cloud – Staging & Production
# =======================================================
# This workflow runs on every push to 'dev' or 'main', or manually.
# It builds the backend (Spring Boot) and frontend (React/Vite),
# then deploys to the appropriate environment based on the branch.
# =======================================================

name: Deploy to Server

on:
  push:
    branches:
      - dev      # pushes to dev → staging environment
      - main     # pushes to main → production environment
  workflow_dispatch:   # allows manual trigger from GitHub Actions UI

# =======================================================
# Global environment variables – used across all steps.
# JAR_NAME and BACKEND_PORT are defaults; paths and service
# names are set dynamically per branch later.
# =======================================================
env:
  JAR_NAME: backend-0.0.1-SNAPSHOT.jar   # name of the built JAR file

jobs:
  deploy:
    runs-on: ubuntu-latest
    # ✅ GitHub Environments – enables branch‑specific approvals and variable overrides
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      # ---------------------------------------------------
      # 1. Check out the source code from the branch that triggered the workflow
      # ---------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # 2. Set up Java 17 (required for Spring Boot 3)
      # ---------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ---------------------------------------------------
      # 3. Cache Maven dependencies to speed up builds
      # ---------------------------------------------------
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # ---------------------------------------------------
      # 4. Build the backend (Spring Boot) – creates a JAR file
      # ---------------------------------------------------
      - name: Build Backend
        run: |
          cd backend
          mvn clean package -DskipTests

      # ---------------------------------------------------
      # 5. Set up Node.js 18 (required for Vite + React)
      # ---------------------------------------------------
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web-admin/package-lock.json

      # ---------------------------------------------------
      # 6. Build the frontend (React + Vite) – creates dist/ folder
      # ---------------------------------------------------
      - name: Build Web-Admin
        run: |
          cd web-admin
          npm install
          npm run build

      # =======================================================
      # 7. Deployment – environment selection based on branch
      # =======================================================

      # ---------------------------------------------------
      # 7a. Set environment‑specific variables (paths, service name, port)
      # ---------------------------------------------------
      - name: Set deployment paths and service name
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "dev" ]]; then
            # Staging environment (dev branch)
            echo "APP_PATH=/opt/rental-app-staging" >> $GITHUB_OUTPUT
            echo "WEB_PATH=/var/www/rental-admin-staging" >> $GITHUB_OUTPUT
            echo "SERVICE_NAME=rental-app-staging" >> $GITHUB_OUTPUT
            echo "BACKEND_PORT=8586" >> $GITHUB_OUTPUT
          else
            # Production environment (main branch)
            echo "APP_PATH=/opt/rental-app" >> $GITHUB_OUTPUT
            echo "WEB_PATH=/var/www/rental-admin" >> $GITHUB_OUTPUT
            echo "SERVICE_NAME=rental-app" >> $GITHUB_OUTPUT
            echo "BACKEND_PORT=8585" >> $GITHUB_OUTPUT
          fi

      # ---------------------------------------------------
      # 7b. SSH Authentication – inject the private key
      # ---------------------------------------------------
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # ---------------------------------------------------
      # 7c. Add the server to known_hosts to avoid host key verification prompt
      # ---------------------------------------------------
      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # ---------------------------------------------------
      # 7d. Backup the current JAR (optional rollback)
      # ---------------------------------------------------
      - name: Backup current JAR
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cp ${{ steps.env.outputs.APP_PATH }}/${{ env.JAR_NAME }} ${{ steps.env.outputs.APP_PATH }}/${{ env.JAR_NAME }}.backup || true"

      # ---------------------------------------------------
      # 7e. Copy the new JAR to the server
      # ---------------------------------------------------
      - name: Copy Backend JAR
        run: |
          scp backend/target/${{ env.JAR_NAME }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ steps.env.outputs.APP_PATH }}/

      # ---------------------------------------------------
      # 7f. Restart the systemd service for the specific environment
      # ---------------------------------------------------
      - name: Restart Backend Service
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "systemctl restart ${{ steps.env.outputs.SERVICE_NAME }}"

      # ---------------------------------------------------
      # 7g. Health check – wait for the backend to become responsive
      # ---------------------------------------------------
      - name: Wait for Backend to be Healthy
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "for i in {1..30}; do \
               curl -s -o /dev/null -w '%{http_code}' http://localhost:${{ steps.env.outputs.BACKEND_PORT }}/api/properties | grep 200 && echo 'Backend is ready' && break || \
               echo 'Waiting for backend...' && sleep 2; \
             done"

      # ---------------------------------------------------
      # 7h. Sync the frontend static files using rsync
      # ---------------------------------------------------
      - name: Sync Web-Admin static files
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p ${{ steps.env.outputs.WEB_PATH }}"
          rsync -avz --delete web-admin/dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ steps.env.outputs.WEB_PATH }}/

      # ---------------------------------------------------
      # 7i. Reload Nginx gracefully (if config changes)
      # ---------------------------------------------------
      - name: Reload Nginx
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "nginx -t && systemctl reload nginx"