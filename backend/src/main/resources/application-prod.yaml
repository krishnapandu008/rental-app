spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/rental_db
    username: postgres
    password: ${DB_PASSWORD:postgres}
  
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false

  flyway:
    enabled: true
    validate-on-migrate: false   # Temporarily disabled (you may enable later)

app:
  storage:
    local:
      upload-dir: /var/www/rental-images/properties
      base-url: https://ksdcnit.com
  image:
    base-url: https://ksdcnit.com

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.web.servlet.config.annotation.CorsRegistry: TRACE

# ============ ACTUATOR (Prod) – restrict to localhost ============
management:
  server:
    address: 127.0.0.1
    port: 8587
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

cookie:
  secure: true   # Set to true for production (HTTPS only)