spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history

server:
  port: 8585
  address: 0.0.0.0

# ============ JWT CONFIG (externalised secret) ============
jwt:
  secret: ${JWT_SECRET:mySecretKeyThatShouldBeAtLeast256BitsLongForHSWithSHA256Algorithm}
  expiration: 86400000
  refresh-expiration: 2592000000

ollama:
  url: http://localhost:11434
  model: gemma3:1b
  timeout: 15000
  enabled: true

app:
  voice-search:
    fallback-enabled: true
    ai-timeout-ms: 800
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:5174,https://ksdcnit.com"

geocoding:
  enabled: true
  nominatim:
    url: https://nominatim.openstreetmap.org/search
    user-agent: rental-app/1.0

# ============ ACTUATOR (Common) ============
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# ============ COOKIE SECURE FLAG ============
# Default for local development (overridden in dev/prod if needed)
cookie:
  secure: false