spring:
  profiles:
    active: dev
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: 8585
  address: 0.0.0.0

jwt:
  secret: mySecretKeyThatShouldBeAtLeast256BitsLongForHSWithSHA256Algorithm
  expiration: 86400000
  refresh-expiration: 2592000000

ollama:
  url: http://localhost:11434
  model: phi3:mini
  timeout: 3000          # ✅ Connection timeout (3 seconds)
  enabled: true

app:
  voice-search:
    fallback-enabled: true
    ai-timeout-ms: 800   # ✅ AI extraction timeout (800ms)